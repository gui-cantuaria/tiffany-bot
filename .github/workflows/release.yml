# Canonical release pipeline — every push to main must pass all gates before deploy.
# Replaces the scripts-only deploy bypass (947ad5d failure mode).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate (unit + lifecycle + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Record validated SHA
        run: echo "VALIDATED_SHA=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Gate A - Static Analysis & Syntax Verification
        run: python -m py_compile *.py infra/*.py

      - name: Gate B - Run lifecycle, rollback, isolation, and smoke unit tests
        env:
          PYTHONUTF8: '1'
        run: |
          python -m pytest test_postgres_config.py test_phase10_lifecycle.py test_phase11_lifecycle.py \
            test_outbox_concurrency.py test_payments_phase3.py test_launcher_signals.py test_deployment_rollback.py \
            test_premium_isolation.py test_failure_classification.py -v --tb=short
          python -m unittest test_smoke -v

      - name: Gate C - Run Dedicated Music/Voice Regression & Isolation Suite
        env:
          PYTHONUTF8: '1'
        run: python -m unittest test_music_regression -v

  integration:
    name: Integration (PostgreSQL 16 + Redis 7)
    needs: validate
    runs-on: ubuntu-latest
    env:
      TIFFANY_INTEGRATION_TESTS: "1"
      INTEGRATION_DATABASE_URL: postgresql://tiffany_test:tiffany_test@127.0.0.1:5433/tiffany_test?ssl=disable
      INTEGRATION_REDIS_URL: redis://127.0.0.1:6380/0
      DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL 16 and Redis 7
        run: docker compose -f docker-compose.integration.yml up -d --wait

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Integration tests
        env:
          PYTHONUTF8: '1'
        run: python -m pytest tests/integration -v --tb=short

      - name: Tear down integration containers
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v

  deploy:
    name: Deploy to VPS
    needs: integration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify gate SHA
        run: |
          echo "Deploying validated SHA: ${{ github.sha }}"
          echo "EXPECTED_SHA=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [ -z "$SSH_KEY" ]; then
            echo "VPS_SSH_KEY secret is empty — add the private key in GitHub Settings → Secrets."
            exit 1
          fi
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "VPS_HOST secret is empty — add the VPS IP in GitHub Settings → Secrets."
            exit 1
          fi
          if [ -n "$KNOWN_HOSTS" ]; then
            echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=45 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            root@"$VPS_HOST" "cd /opt/tiffany-bot && git fetch origin main && git reset --hard origin/main && export DEPLOY_MODE=systemd EXPECTED_SHA=${{ github.sha }} && bash /opt/tiffany-bot/scripts/deploy.sh"

      - name: Post-deploy health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "VPS_HOST secret is empty"
            exit 1
          fi
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=45 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            root@"$VPS_HOST" "export EXPECTED_SHA=${{ github.sha }} READINESS_TIMEOUT_SEC=60 && bash /opt/tiffany-bot/scripts/post-deploy-health.sh"
