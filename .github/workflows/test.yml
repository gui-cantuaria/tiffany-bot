name: Tests

on:
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'schema/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: [Gate A] Static Analysis & Syntax Verification
        run: python -m py_compile *.py infra/*.py

      - name: [Gate B] Run lifecycle, payments, and smoke unit tests
        env:
          PYTHONUTF8: '1'
        run: |
          python -m pytest test_postgres_config.py test_phase10_lifecycle.py test_phase11_lifecycle.py \
            test_outbox_concurrency.py test_payments_phase3.py test_launcher_signals.py test_deployment_rollback.py \
            test_premium_isolation.py test_failure_classification.py -v --tb=short
          python -m unittest test_smoke -v

      - name: [Gate C] Run Dedicated Music/Voice Regression & Isolation Suite
        env:
          PYTHONUTF8: '1'
        run: python -m unittest test_music_regression -v
