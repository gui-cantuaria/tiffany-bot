name: Tests

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'schema/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'schema/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run lifecycle and payments tests
        env:
          PYTHONUTF8: '1'
        run: |
          python -m pytest test_phase10_lifecycle.py test_phase11_lifecycle.py test_outbox_concurrency.py test_payments_phase3.py test_launcher_signals.py -v

      - name: Run smoke tests
        env:
          PYTHONUTF8: '1'
        run: python -m unittest test_smoke -v
