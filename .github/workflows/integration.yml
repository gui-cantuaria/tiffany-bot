name: Integration Tests

on:
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'schema/**'
      - 'docker-compose.integration.yml'
      - '.github/workflows/integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      TIFFANY_INTEGRATION_TESTS: "1"
      INTEGRATION_DATABASE_URL: postgresql://tiffany_test:tiffany_test@127.0.0.1:5433/tiffany_test?ssl=disable
      INTEGRATION_REDIS_URL: redis://127.0.0.1:6380/0
      DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL 16 and Redis 7
        run: docker compose -f docker-compose.integration.yml up -d --wait

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: [Gate A] Static Analysis & Syntax Verification
        run: python -m py_compile *.py infra/*.py

      - name: [Gate B] Run lifecycle & smoke unit tests
        env:
          PYTHONUTF8: '1'
        run: |
          python -m pytest test_phase10_lifecycle.py test_phase11_lifecycle.py test_outbox_concurrency.py test_payments_phase3.py test_launcher_signals.py test_deployment_rollback.py test_premium_isolation.py test_failure_classification.py -v --tb=short
          python -m unittest test_smoke -v

      - name: [Gate C] Run Dedicated Music/Voice Regression & Isolation Suite
        env:
          PYTHONUTF8: '1'
        run: python -m unittest test_music_regression -v

      - name: [Gate D] Run real infrastructure integration tests
        env:
          PYTHONUTF8: '1'
        run: python -m pytest tests/integration -v --tb=short

      - name: Tear down integration containers
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v
