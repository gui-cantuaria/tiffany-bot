# Phase XII — isolated integration test infrastructure (local + CI).
# Usage: docker compose -f docker-compose.integration.yml up -d
#        set TIFFANY_INTEGRATION_TESTS=1 (Windows) / export TIFFANY_INTEGRATION_TESTS=1
#        pytest tests/integration -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: tiffany-integration-pg
    environment:
      POSTGRES_USER: tiffany_test
      POSTGRES_PASSWORD: tiffany_test
      POSTGRES_DB: tiffany_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiffany_test -d tiffany_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tiffany-integration-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
