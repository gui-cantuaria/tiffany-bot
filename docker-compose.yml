# Tiffany OS — Full 24/7 Autonomous Docker Production Composition
# Runs Lavalink + Tiffany Bot with 24/7 auto-restart, healthchecks, and log rotation.

services:
  lavalink-primary:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink-primary
    restart: always
    network_mode: host
    environment:
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:-tiffany_lavalink_2026}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      # WARP SOCKS5 on host — YouTube/datacenter bypass
      - JAVA_TOOL_OPTIONS=-DsocksProxyHost=127.0.0.1 -DsocksProxyPort=40000
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink-logs:/opt/Lavalink/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tiffany-bot:
    build: .
    container_name: tiffany_bot
    restart: always
    network_mode: host
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - lavalink-primary
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lavalink-logs:
